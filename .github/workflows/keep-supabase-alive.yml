name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta automáticamente cada 4 días a las 10:00 UTC
    - cron: '0 10 */4 * *'
  workflow_dispatch: # Te permite probarlo manualmente desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -f -s -o /dev/null \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/busy_dates?select=date_str&limit=1"